<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>review-hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23F2F5F9'/><g stroke='%2316A34A' stroke-width='3' stroke-linecap='round'><line x1='10' y1='6.5' x2='10' y2='15.5'/><line x1='5.5' y1='11' x2='14.5' y2='11'/></g><line x1='17.5' y1='21.5' x2='26.5' y2='21.5' stroke='%23DC2626' stroke-width='3' stroke-linecap='round'/><line x1='19' y1='7' x2='13' y2='25.5' stroke='%23C3CDD9' stroke-width='1.6' stroke-linecap='round'/></svg>">
<link rel="stylesheet" href="/client/shell.css">
<script>window.__SESSION_ID__ = "%%SESSION_ID%%";</script>
</head>
<body>
<header id="topbar">
  <div id="brand">review-hub</div>
  <div id="session-title"></div>
  <nav id="tabs"></nav>
  <div id="hidden-tabs" hidden>
    <button id="hidden-tabs-btn" title="非表示にしたタブの一覧">非表示 <span id="hidden-tabs-count"></span> ▾</button>
    <div id="hidden-tabs-menu" hidden></div>
  </div>
  <button id="memo-btn" hidden title="中断時に残した自分用メモを表示">📝 中断メモ</button>
  <div id="conn" title="hub サーバとの接続状態">●</div>
</header>
<div id="memo-modal" hidden>
  <div id="memo-box">
    <div id="memo-title">⏸ 中断時のメモ</div>
    <div id="memo-time"></div>
    <div id="memo-text"></div>
    <button id="memo-close">閉じる</button>
  </div>
</div>
<div id="status-bar" hidden>
  <div id="phase-steps"></div>
  <div id="status-note"></div>
  <div id="waiting">
    <button id="waiting-btn" title="エージェントがユーザーの返事を待っている事項">返事待ち <span id="waiting-count">0</span>件 ▾</button>
    <div id="waiting-menu" hidden></div>
  </div>
  <div id="status-meta"></div>
  <button id="interrupt-btn" title="作業を中断し、レビュー関連のサーバをすべて停止します（サインアウト前用）">⏸ 中断</button>
</div>
<div id="notice" hidden></div>
<div id="approval-bar" hidden>
  <span id="approval-label"></span>
  <textarea id="approval-note" rows="1" placeholder="追加指示（任意）例: 承認後そのまま MR 作成まで進めて"></textarea>
  <button id="approve-btn">承認</button>
  <span id="approved-mark" hidden></span>
  <span id="approval-receipt" hidden></span>
</div>
<div id="tab-context-menu" hidden>
  <button id="hide-tab-item">このタブを非表示</button>
</div>
<main id="frames"></main>
<div id="empty" hidden>タブがまだありません。エージェントがタブを追加するとここに表示されます。</div>
<script src="/client/shell.js"></script>
</body>
</html>
